site_name: MealPlanner Documentation
site_description: Documentation for the MealPlanner application - Angular 19 + .NET 9
site_url: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - fr
        - en

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Getting Started: getting-started.md
  - Projet:
      - Vision & Domaine: project/brief.md
      - Migration Firestore:
          - ADR Architecture: project/firestore-migration/adr/2026_02_07_targeted_architecture_to_include_firestore.md
          - Decision Matrix: project/firestore-migration/decision-matrix.md
          - Entity Mapping: project/firestore-migration/entity-mapping.md
          - Schema & Indexes: project/firestore-migration/schema-indexes.md
      - Migration Mediator: project/mediator-migration.md
  - Architecture:
      - Vue d'ensemble: architecture/overview.md
      - Stack Technique: architecture/stack.md
      - Structure du Code: architecture/codebase-structure.md
  - Conventions:
      - Backend (.NET): conventions/backend.md
      - Frontend (Angular): conventions/frontend.md
      - Design System: conventions/design.md
      - Tests: conventions/testing.md
      - Standards de Code: conventions/coding-assertions.md
  - API:
      - Endpoints: api/endpoints.md
      - Architecture des flux: api/architecture.md
  - Deployment:
      - Docker & Infrastructure: deployment/deployment.md
  - Guides:
      - Commits: guides/commit.md
      - Migrations BDD: guides/database-migrations.md
      - Variables d'environnement: guides/environment-variables.md
      - SSL/TLS: guides/ssl-tls-configuration.md
  - Rules:
      - Overview: rules/README.md
      - DDD: rules/ddd.md
      - Craft: rules/craft.md
      - Functional: rules/functional.md
      - API Design: rules/api-design.md
      - Concurrency: rules/concurrency.md
      - Observability: rules/observability.md
      - Performance: rules/performance.md
  - READMEs:
      - Vue d'ensemble: readmes/index.md
      - Projet (racine): readmes/root.md
      - Kanban Viewer: readmes/kanban-view.md
      - AIDD Prompts: readmes/aidd--prompts.md
      - AIDD Templates: readmes/aidd--prompts--templates.md
