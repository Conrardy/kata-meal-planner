<aside class="hidden lg:flex flex-col w-64 bg-white border-r border-gray-200 h-screen sticky top-0" role="navigation" aria-label="Main navigation">
  <!-- Logo -->
  <div class="px-6 py-4 border-b border-gray-200">
    <h1 class="text-2xl font-bold text-gray-900">MealPrep</h1>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-6" aria-label="Primary">
    <div class="space-y-1">
      <a
        routerLink="/"
        routerLinkActive="bg-orange-50 text-primary"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors"
        data-testid="nav-today"
      >
        <lucide-icon [img]="Home" class="w-5 h-5"></lucide-icon>
        <span class="font-medium">Today</span>
      </a>
      <a
        routerLink="/weekly-plan"
        routerLinkActive="bg-orange-50 text-primary"
        class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors"
        data-testid="nav-weekly-plan"
      >
        <lucide-icon [img]="Calendar" class="w-5 h-5"></lucide-icon>
        <span class="font-medium">Weekly Plan</span>
      </a>
      <a
        routerLink="/recipes"
        routerLinkActive="bg-orange-50 text-primary"
        class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors"
        data-testid="nav-recipes"
      >
        <lucide-icon [img]="Search" class="w-5 h-5"></lucide-icon>
        <span class="font-medium">Discover Recipes</span>
      </a>
      <a
        routerLink="/shopping-list"
        routerLinkActive="bg-orange-50 text-primary"
        class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors"
        data-testid="nav-shopping-list"
      >
        <lucide-icon [img]="ShoppingCart" class="w-5 h-5"></lucide-icon>
        <span class="font-medium">Shopping List</span>
      </a>
      <a
        routerLink="/preferences"
        routerLinkActive="bg-orange-50 text-primary"
        class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors"
        data-testid="nav-preferences"
      >
        <lucide-icon [img]="Settings" class="w-5 h-5"></lucide-icon>
        <span class="font-medium">Preferences</span>
      </a>
      @if (isAdmin()) {
        <a
          routerLink="/admin/users"
          routerLinkActive="bg-orange-50 text-primary"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors"
          data-testid="nav-admin-users"
        >
          <lucide-icon [img]="Users" class="w-5 h-5"></lucide-icon>
          <span class="font-medium">Admin Users</span>
        </a>
      }
    </div>

    <!-- Quick Actions -->
    <div class="mt-8">
      <h2 class="px-3 mb-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Quick Actions</h2>
      <div class="space-y-2" role="group" aria-label="Quick actions">
        <button
          type="button"
          (click)="onAddRecipe()"
          class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-orange-50 hover:text-primary transition-colors"
          data-testid="quick-action-add-recipe"
          aria-label="Add a new recipe"
        >
          <lucide-icon [img]="Plus" class="w-5 h-5" aria-hidden="true"></lucide-icon>
          <span class="font-medium">Add Recipe</span>
        </button>
        <button
          type="button"
          (click)="onCreatePlan()"
          class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-orange-50 hover:text-primary transition-colors"
          data-testid="quick-action-create-plan"
          aria-label="Create a new meal plan"
        >
          <lucide-icon [img]="CalendarDays" class="w-5 h-5" aria-hidden="true"></lucide-icon>
          <span class="font-medium">Create Meal Plan</span>
        </button>
        <button
          type="button"
          (click)="onGenerateList()"
          class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-orange-50 hover:text-primary transition-colors"
          data-testid="quick-action-generate-list"
          aria-label="Generate shopping list from meal plan"
        >
          <lucide-icon [img]="ShoppingCart" class="w-5 h-5" aria-hidden="true"></lucide-icon>
          <span class="font-medium">Generate Shopping List</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- User Section -->
  <div class="px-4 py-4 border-t border-gray-200">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white font-medium text-sm flex-shrink-0">
          {{ currentUser().username?.charAt(0)?.toUpperCase() || '?' }}
        </div>
        <span class="text-sm font-medium text-gray-700 truncate">{{ currentUser().username || 'User' }}</span>
      </div>
      <button
        type="button"
        (click)="onLogout()"
        class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition-colors"
        data-testid="logout-button"
        aria-label="Sign out"
        title="Sign out"
      >
        <lucide-icon [img]="LogOut" class="w-5 h-5" aria-hidden="true"></lucide-icon>
      </button>
    </div>
  </div>
</aside>
